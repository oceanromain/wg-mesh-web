services:
  wg-mesh-web:
    build: .
    image: wg-mesh-web:latest
    container_name: wg-mesh-web
    restart: always
    mem_limit: 128m
    ports:
      # 宿主机端口通过 WG_PORT 覆盖：WG_PORT=8080 docker compose up -d
      - "${WG_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
